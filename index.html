<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyek Roro Jonggrang</title>
    
    <!-- Link Font Awesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Link Google Font Original Surfer -->
    <link href="https://fonts.googleapis.com/css2?family=Original+Surfer&display=swap" rel="stylesheet">
    
    <!-- MENGHUBUNGKAN KE FILE CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-tasks"></i> Proyek Roro Jonggrang</h1>
            <button id="themeToggle" class="theme-btn"><i class="fas fa-moon"></i></button>
        </header>

        <section class="input-section">
            <form id="taskForm">
                <div class="form-group">
                    <label for="taskName">Nama Tugas</label>
                    <input type="text" id="taskName" placeholder="Contoh: Laporan Pertanggungjawaban... 😭" required>
                </div>
                
                <div class="form-group-row">
                    <div class="form-group w-50">
                        <label for="taskCategory">Kategori</label>
                        <select id="taskCategory">
                            <option value="Tugas Sekolah">Tugas Sekolah</option>
                            <option value="OSIS Aksara Bosch">OSIS Aksara Bosch</option>
                            <option value="Lomba/Kompetisi">Lomba / Kompetisi</option>
                            <option value="Pribadi">Pribadi</option>
                        </select>
                    </div>
                    <div class="form-group w-50">
                        <label for="taskDeadline">Tenggat Waktu</label>
                        <input type="datetime-local" id="taskDeadline" required>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Tambah Tugas</button>
            </form>
        </section>

        <section class="list-section">
            <h2>Daftar Tugas</h2>
            <div class="filters">
                <button class="filter-btn active" data-filter="all">Semua</button>
                <button class="filter-btn" data-filter="pending">Belum Selesai</button>
                <button class="filter-btn" data-filter="completed">Selesai</button>
            </div>
            <div id="taskList" class="task-list"></div>
        </section>
    </div>

    <!-- KARAKTER PENDAMPING (MASKOT KODOK GARIN VTUBER) -->
    <div class="mascot-container">
        
        <!-- TIPS: Jika suatu saat kamu punya gambar chibi Garin.png yang ingin dipakai, 
             hapus komentar kode <img> di bawah ini, dan hapus <div class="pet-body"> -->
        <!-- <img src="garin.png" id="petBody" alt="Garin VTuber" style="width: 70px; cursor: pointer; animation: floatPet 3s ease-in-out infinite;"> -->

       <!-- KARAKTER PENDAMPING (GARIN VTUBER ASLI) -->
    <div class="mascot-container">
        <!-- Ini adalah kode gambar yang sudah diaktifkan -->
        <img src="garin.png" id="petBody" alt="Garin VTuber" style="width: 80px; cursor: pointer; animation: floatPet 3s ease-in-out infinite; z-index: 10;">
        
        <div class="pet-shadow"></div>
    </div>

    <!-- MENGHUBUNGKAN KE FILE JAVASCRIPT -->
    <script src="script.js"></script>
</body>
</html>
