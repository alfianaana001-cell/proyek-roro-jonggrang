<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyek Roro Jonggrang</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- KODE UNTUK FONT ORIGINAL SURFER -->
    <link href="https://fonts.googleapis.com/css2?family=Original+Surfer&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-tasks"></i>Proyek Roro Jonggrang</h1>
            <button id="themeToggle" class="theme-btn"><i class="fas fa-moon"></i></button>
        </header>

        <section class="input-section">
            <form id="taskForm">
                <div class="form-group">
                    <label for="taskName">Nama Tugas</label>
                    <input type="text" id="taskName" placeholder="Contoh: Laporan Pertanggungjawaban..." required>
                </div>
                
                <div class="form-group-row">
                    <div class="form-group w-50">
                        <label for="taskCategory">Kategori</label>
                        <select id="taskCategory">
                            <option value="Tugas Sekolah">Tugas Sekolah</option>
                            <option value="OSIS Aksara Bosch">OSIS Aksara Bosch</option>
                            <option value="Ekstra Kurikuler">Ekstra Kurikuler</option>
                            <option value="Lomba/Kompetisi">Lomba / Kompetisi</option>
                            <option value="Pribadi">Pribadi</option>
                            <option value="Tujuan Hidup">Tujuan Hidup</option>
                        </select>
                    </div>
                    <div class="form-group w-50">
                        <label for="taskDeadline">Tenggat Waktu</label>
                        <input type="datetime-local" id="taskDeadline" required>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Tambah Tugas</button>
            </form>
        </section>

        <section class="list-section">
            <h2>Daftar Tugas</h2>
            <div class="filters">
                <button class="filter-btn active" data-filter="all">Semua</button>
                <button class="filter-btn" data-filter="pending">Belum Selesai</button>
                <button class="filter-btn" data-filter="completed">Selesai</button>
            </div>
            <div id="taskList" class="task-list">
                <!-- Tugas akan muncul di sini dari JavaScript -->
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
